name: Workflow diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Validate GitHub Actions workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm job execution
        run: |
          echo "Diagnostic workflow started."
          test -f .github/workflows/critical-cash-validation.yml
      - name: Lint workflow definitions
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: "true"
