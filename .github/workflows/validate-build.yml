name: Validate build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "drizzle/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/validate-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "drizzle/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/validate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Validate top-level SQL migration syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          if not files:
              raise SystemExit("No Supabase migrations were found.")
          for path in files:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"SQL syntax OK: {path}")
          print(f"Validated {len(files)} Supabase migration files.")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for pinned security fixes
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Upload refreshed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build application
        run: npm run build
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
