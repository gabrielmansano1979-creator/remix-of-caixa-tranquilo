name: Validate build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "drizzle/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/validate-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "drizzle/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/validate-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Validate top-level SQL migration syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          if not files:
              raise SystemExit("No Supabase migrations were found.")
          for path in files:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"SQL syntax OK: {path}")
          print(f"Validated {len(files)} Supabase migration files.")
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update npm for lockfile resolution
        run: npm install --global npm@11
      - name: Resolve fresh lockfile for pinned security fixes
        run: rm -f package-lock.json && npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Upload refreshed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build application
        run: npm run build
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Checkout PR branch for lockfile update
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: lockfile-branch
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Commit refreshed lockfile after successful validation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp package-lock.json lockfile-branch/package-lock.json
          cd lockfile-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update dependency lockfile for patched toolchain"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
