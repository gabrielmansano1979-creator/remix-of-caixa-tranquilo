name: Critical Cash validation

on:
  push:
    branches:
      - main
      - fix/financial-counterparty-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Critical Cash build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Print workflow diagnostics
        run: |
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Lint changed TypeScript files
        run: |
          npx eslint src/routes/index.tsx src/integrations/supabase/types.ts --rule 'prettier/prettier: off'
